spring.application.name=StayFlow

# DATASOURCE (MYSQL 8.0)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/stayflow_db?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Millan2801

# JPA
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Directorio para subir imagenes
upload.dir=uploads/avatars/

# Servir archivos estaticos desde la carpeta uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/,file:C:/Users/David/Documents/workspace-spring-tool-suite-4/StayFlow/uploads/

# Tamano maximo de archivo
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT Configuration
jwt.secret=ClaveSecretaSuperLargaYSeguraParaLosTokensDeStayFlow2026
jwt.expiration=900000        
jwt.refresh-expiration=604800000