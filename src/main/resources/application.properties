spring.application.name=StayFlow

# DATASOURCE (MYSQL 8.0)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/stayflow_db?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=RedArmy42
#JPA
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
# Table names physically
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=stayflowSecretKey2024ParaFirmarTokensJWTSuperSegura123456789
jwt.expiration=900000        
jwt.refresh-expiration=604800000

# Configuracion de archivos multimedia

# Límite máximo por cada foto (5 Megabytes)
spring.servlet.multipart.max-file-size=5MB
# Límite máximo por petición (20 Megabytes en total)
spring.servlet.multipart.max-request-size=20MB

